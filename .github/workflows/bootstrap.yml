name: Bootstrap PulseForge source

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part00 \
            .bootstrap/chunk01 \
            .bootstrap/chunk02 \
            .bootstrap/chunk03 \
            .bootstrap/chunk04 \
            .bootstrap/chunk05 \
            .bootstrap/chunk06 \
            .bootstrap/chunk07a \
            .bootstrap/chunk07b \
            .bootstrap/chunk08 \
            > /tmp/pulseforge.tar.gz.b64
          base64 --decode /tmp/pulseforge.tar.gz.b64 > /tmp/pulseforge.tar.gz
          echo "40b3d91e9912f7dcd181786d73a5e3bf59659d0b9b32926339fcd2fb7d59ac37  /tmp/pulseforge.tar.gz" | sha256sum --check --strict

      - name: Expand tested PulseForge tree without replacing workflows
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/pulseforge.tar.gz -C .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml

      - name: Publish application source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: build PulseForge intelligence vertical slice"
          git push
