name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: pip install -e '.[dev]'
      - name: Install web
        working-directory: apps/web
        run: npm install
      - name: Lint backend
        run: ruff check apps/api
      - name: Check backend formatting
        run: ruff format --check apps/api
      - name: Test backend
        run: pytest --cov=apps/api/pulseforge --cov-report=term-missing
      - name: Test web
        working-directory: apps/web
        run: npm test -- --run
      - name: Start API for web build
        run: |
          uvicorn pulseforge.main:app --app-dir apps/api --host 127.0.0.1 --port 8000 > /tmp/pulseforge-api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/pulseforge-api.log
          exit 1
      - name: Build web
        working-directory: apps/web
        env:
          PULSEFORGE_SERVER_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_PULSEFORGE_API_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end test
        working-directory: apps/web
        run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build
