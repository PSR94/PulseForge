[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseforge"
version = "0.1.0"
description = "Evidence-linked real-time AI event intelligence platform"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2.9,<4",
  "redis>=6.4,<7",
  "nats-py>=2.11,<3",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["pulseforge*"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
