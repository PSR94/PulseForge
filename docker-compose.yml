services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: pulseforge
      POSTGRES_USER: pulseforge
      POSTGRES_PASSWORD: pulseforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    volumes: ["pulseforge-postgres:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PULSEFORGE_DATABASE_URL: postgresql+psycopg://pulseforge:pulseforge@postgres:5432/pulseforge
      PULSEFORGE_REDIS_URL: redis://redis:6379/0
      PULSEFORGE_NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      nats: { condition: service_started }
    ports: ["8000:8000"]

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_PULSEFORGE_API_URL: http://localhost:8000
      PULSEFORGE_SERVER_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pulseforge-postgres:
